name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'
      - run: gradle build
      - uses: actions/upload-artifact@v7
        with:
          name: drillfix
          path: build/libs/*.jar
